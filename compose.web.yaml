services:
  volvo-web:
    build: .
    image: local/volvo2mqtt:keycloak
    command: ["python", "-u", "web_login.py"]
    restart: unless-stopped
    ports:
      - "192.168.1.221:8080:8080"
    environment:
      WEB_SETTINGS_PATH: /setup/settings.json
      TOKEN_PATH: /data/keycloak-token.json
    volumes:
      - ./:/setup:ro
      - ./data:/data
      - ./web-password:/run/secrets/web_password:ro
